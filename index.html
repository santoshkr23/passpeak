<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Original certification exam practice questions with explanations. 30 free questions per exam, premium PDFs available.">
<title>PassPeak Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: answer-sheet motif — exam codes in mono, options as fillable bubbles, highlighter-yellow marks the one thing that matters per view */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#121a2e; --muted:#5a6580; --line:#dde2ec;
  --accent:#2446e8; --accent-ink:#ffffff; --mark:#ffd84d; --good:#138a52; --bad:#c8343f; --soft:#e8ecfb;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1220; --surface:#151c2f; --ink:#e9edf7; --muted:#9aa5bf; --line:#263049;
  --accent:#6f8bff; --accent-ink:#0d1220; --mark:#e8c43a; --good:#3ccf8a; --bad:#ff6b75; --soft:#1c2643; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1220; --surface:#151c2f; --ink:#e9edf7; --muted:#9aa5bf; --line:#263049;
  --accent:#6f8bff; --accent-ink:#0d1220; --mark:#e8c43a; --good:#3ccf8a; --bad:#ff6b75; --soft:#1c2643; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2.4rem,6vw,4.2rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.7rem,3.5vw,2.4rem);font-weight:700;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.02em}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.hl{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .1em}
:root[data-theme="dark"] .hl{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:.5em;border:0;border-radius:10px;padding:.8em 1.3em;font:600 .95rem var(--f-body);cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:24px;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;font:800 1.25rem var(--f-display);text-decoration:none}
.logo i{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center}
.logo i::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.nav nav{display:flex;gap:20px;margin-left:auto;align-items:center;flex-wrap:wrap}
.nav nav a{text-decoration:none;color:var(--muted);font-weight:500}
.nav nav a.on,.nav nav a:hover{color:var(--ink)}
.nav nav a.btn-primary{color:var(--accent-ink)}
@media(max-width:560px){.nav nav a.hide-sm{display:none}}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding-block:64px 48px}
.hero > *{min-width:0}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:34ch;margin-top:18px}
.search{display:flex;gap:8px;margin-top:28px;max-width:480px;position:relative}
.search input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:.85em 1em;font:inherit}
.sugg{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;z-index:5;box-shadow:0 12px 30px rgba(10,20,50,.12)}
.sugg a{display:flex;gap:12px;padding:10px 14px;text-decoration:none;border-bottom:1px solid var(--line)}
.sugg a:last-child{border:0}.sugg a:hover{background:var(--soft)}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-block:40px}}
/* sample sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 20px 50px -20px rgba(18,26,46,.25);transform:rotate(1.2deg)}
.sheet-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px dashed var(--line);padding-bottom:12px;margin-bottom:16px;gap:12px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font:600 .78rem var(--f-mono);color:var(--muted)}
.opt.picked .bub{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.opt.right{border-color:var(--good)}.opt.right .bub{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad)}.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
/* sections */
section.band{padding-block:64px;border-top:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:32px}
.sec-head p{color:var(--muted);max-width:52ch;margin-top:8px}
.vendors{display:flex;flex-wrap:wrap;gap:10px;padding-block:8px 40px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem;background:var(--surface);text-decoration:none;color:var(--ink);cursor:pointer;font-family:var(--f-body)}
.chip:hover,.chip.on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;counter-reset:s}
.steps li{list-style:none;counter-increment:s;border-top:3px solid var(--ink);padding-top:18px}
.steps li::before{content:"Step " counter(s);display:block;font:500 .78rem var(--f-mono);color:var(--accent);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
.steps p,.feat p{color:var(--muted);margin-top:8px}
.steps{padding:0;margin:0}
.feat{display:grid;grid-template-columns:repeat(2,1fr);gap:40px 56px}
@media(max-width:760px){.steps,.feat{grid-template-columns:1fr}}
/* exam list */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.exam{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-decoration:none;transition:border-color .15s}
.exam:hover{border-color:var(--accent)}
.exam .code{font:500 .8rem var(--f-mono);color:var(--accent)}
.exam b{font-weight:600;line-height:1.35}
.exam small{color:var(--muted);margin-top:auto;padding-top:8px}
.tag{display:inline-block;font:600 .7rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:var(--mark);color:#1b1500}
/* practice */
.prac{display:grid;grid-template-columns:260px 1fr;gap:32px;padding-block:40px 64px}
.prac > *{min-width:0}
.side{position:sticky;top:90px;align-self:start;display:grid;gap:16px}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.map button{aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:500 .8rem var(--f-mono);cursor:pointer}
.map button.cur{border-color:var(--ink);border-width:2.5px}
.map button.ok{background:var(--good);border-color:var(--good);color:#fff}
.map button.no{background:var(--bad);border-color:var(--bad);color:#fff}
.map button.lock{color:var(--muted);background:var(--soft);border-style:dashed}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px}
.qmeta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-bottom:14px}
.qtext{font-size:1.15rem;font-weight:500;line-height:1.5}
.explain{margin-top:20px;border-left:3px solid var(--good);background:var(--soft);padding:14px 16px;border-radius:0 10px 10px 0}
.explain.miss{border-color:var(--bad)}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.locked{text-align:center;padding:40px 24px;display:grid;gap:14px;justify-items:center}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
@media(max-width:820px){.prac{grid-template-columns:1fr}.side{position:static}}
/* pricing */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:14px}
.plan.best{border:2px solid var(--ink);position:relative}
.plan.best .tag{position:absolute;top:-12px;left:24px}
.price{font:800 2.6rem var(--f-display);letter-spacing:-.02em}.price small{font:500 .95rem var(--f-body);color:var(--muted)}
.plan ul{padding:0;margin:0;list-style:none;display:grid;gap:8px;color:var(--muted)}
.plan li::before{content:"●";color:var(--accent);margin-right:10px;font-size:.7em;vertical-align:2px}
.plan .btn{margin-top:auto;justify-content:center}
@media(max-width:860px){.plans{grid-template-columns:1fr}}
/* faq */
details{border-bottom:1px solid var(--line);padding-block:18px}
summary{cursor:pointer;font:600 1.08rem var(--f-body);list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::after{content:"+";font:500 1.3rem var(--f-mono);color:var(--accent)}
details[open] summary::after{content:"–"}
details p{color:var(--muted);margin-top:10px;max-width:68ch}
.cta{background:var(--ink);color:var(--bg);border-radius:20px;padding:48px 40px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.cta p{opacity:.75;margin-top:8px}
.cta .btn-primary{background:var(--mark);color:#1b1500}
footer{border-top:1px solid var(--line);padding-block:40px;margin-top:64px;color:var(--muted);font-size:.9rem}
.foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.foot nav{display:flex;gap:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:500;z-index:20}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.sheet{transform:none}}
</style>

</head>

<script>
const FREE = 30;
const V = ["Microsoft","Amazon","CompTIA","Cisco","Google","Databricks","PMI","ISC2","ISACA","Fortinet"];
const EXAMS = [
 {s:"az-900",v:"Microsoft",c:"AZ-900",n:"Microsoft Azure Fundamentals",q:[
  ["Which cloud model lets a company keep sensitive workloads on-premises while bursting other workloads into a public cloud?",["Public cloud","Private cloud","Hybrid cloud","Community cloud"],2,"A hybrid cloud combines on-premises (private) infrastructure with public cloud resources, so workloads can move between them."],
  ["You pay only for the compute time your Azure Functions actually use. Which benefit of cloud computing does this describe?",["High availability","Consumption-based pricing","Elasticity","Fault tolerance"],1,"Consumption-based (pay-as-you-go) pricing means you are billed for the resources you use, not for capacity you reserve."],
  ["Which Azure service provides a managed relational database based on the SQL Server engine?",["Azure Cosmos DB","Azure SQL Database","Azure Table Storage","Azure Cache for Redis"],1,"Azure SQL Database is a PaaS relational database built on the SQL Server engine. Cosmos DB is a NoSQL service."],
  ["What is the smallest unit you can use to group related Azure resources for management and billing?",["Management group","Subscription","Resource group","Region"],2,"A resource group is a logical container for resources that share a lifecycle. Subscriptions and management groups sit above it."],
  ["Under the shared responsibility model, who is always responsible for the data stored in a SaaS application?",["Microsoft","The customer","The internet provider","It depends on the region"],1,"In every model (IaaS, PaaS, SaaS) the customer remains responsible for their data, accounts and identities."],
  ["Which tool shows recommendations to reduce cost and improve security across your Azure resources?",["Azure Advisor","Azure Monitor","Azure Policy","Azure Blueprints"],0,"Azure Advisor analyzes your configuration and usage and gives personalized recommendations for cost, security, reliability and performance."],
  ["Which feature lets you block the creation of resources outside approved regions?",["Resource locks","Azure Policy","Tags","Role-based access control"],1,"Azure Policy evaluates resources against rules, such as allowed locations, and can deny non-compliant deployments."]]},
 {s:"saa-c03",v:"Amazon",c:"SAA-C03",n:"AWS Certified Solutions Architect – Associate",q:[
  ["An application needs a fully managed in-memory cache to reduce database read latency. Which service fits best?",["Amazon S3","Amazon ElastiCache","Amazon RDS","AWS Glue"],1,"ElastiCache provides managed Redis or Memcached, which serve reads from memory with sub-millisecond latency."],
  ["Which S3 storage class is the lowest-cost option for data that is rarely accessed and can wait 12 hours for retrieval?",["S3 Standard-IA","S3 One Zone-IA","S3 Glacier Deep Archive","S3 Intelligent-Tiering"],2,"Glacier Deep Archive has the lowest storage price, with standard retrieval within 12 hours."],
  ["A web tier must keep running if one Availability Zone fails. What should the architect do?",["Use a larger instance type","Deploy instances across multiple AZs behind a load balancer","Enable detailed monitoring","Use a Dedicated Host"],1,"Spreading instances across AZs behind an Elastic Load Balancer removes the single AZ as a point of failure."],
  ["Instances in a private subnet need outbound internet access for patches but must not accept inbound connections. What do you add?",["An internet gateway on the private subnet","A NAT gateway in a public subnet","A VPC peering connection","An egress-only security group"],1,"A NAT gateway in a public subnet lets private instances start outbound connections while blocking unsolicited inbound traffic."],
  ["Which service decouples components so a spike in orders does not overwhelm the processing tier?",["Amazon SQS","Amazon Route 53","AWS Config","Amazon Inspector"],0,"SQS queues messages so the consumers can process them at their own pace, absorbing bursts."],
  ["Which feature lets an EC2 instance call S3 without storing access keys on the instance?",["IAM user credentials in a file","An IAM role attached to the instance","An S3 bucket ACL","A security group rule"],1,"An instance profile (IAM role) supplies temporary credentials automatically, so no long-term keys are stored."]]},
 {s:"sy0-701",v:"CompTIA",c:"SY0-701",n:"CompTIA Security+",q:[
  ["An attacker sends an email that appears to come from the CEO asking finance to wire money urgently. What is this?",["Vishing","Business email compromise","Tailgating","Watering hole"],1,"Impersonating an executive by email to request payments is business email compromise, a targeted form of phishing."],
  ["Which control type is a security camera that records but nobody actively watches?",["Preventive","Detective","Corrective","Compensating"],1,"Recording footage helps detect and investigate incidents after the fact, so it is a detective control."],
  ["Which algorithm is asymmetric?",["AES","RSA","SHA-256","3DES"],1,"RSA uses a public/private key pair. AES and 3DES are symmetric ciphers, and SHA-256 is a hash."],
  ["What does salting a password before hashing primarily defend against?",["Brute-force on a single account","Rainbow table attacks","Keyloggers","Phishing"],1,"A unique salt makes precomputed hash tables useless because each stored hash differs even for identical passwords."],
  ["Which principle says users get only the access needed for their job?",["Separation of duties","Least privilege","Defense in depth","Implicit deny"],1,"Least privilege limits each account to the minimum permissions its role requires."],
  ["A company wants to confirm a downloaded file has not been altered. What should it compare?",["File size","Hash values","File names","Timestamps"],1,"Matching cryptographic hashes confirm integrity; any change to the file changes its hash."]]},
 {s:"200-301",v:"Cisco",c:"200-301",n:"Cisco Certified Network Associate (CCNA)",q:[
  ["How many usable host addresses are in a /26 subnet?",["30","62","64","126"],1,"A /26 leaves 6 host bits: 2⁶ = 64 addresses, minus network and broadcast = 62 usable hosts."],
  ["Which protocol prevents Layer 2 loops between switches?",["OSPF","STP","HSRP","CDP"],1,"Spanning Tree Protocol blocks redundant switch paths so frames cannot loop forever."],
  ["What is the default administrative distance of OSPF?",["90","100","110","120"],2,"OSPF uses 110. EIGRP internal is 90 and RIP is 120."],
  ["Which device separates broadcast domains by default?",["Hub","Switch","Router","Repeater"],2,"Routers do not forward broadcasts, so each router interface is its own broadcast domain."],
  ["Which port does SSH use?",["21","22","23","443"],1,"SSH runs on TCP 22. Telnet uses 23 and sends data in clear text."],
  ["Which command shows a summary of interface IP addresses and status on a Cisco router?",["show running-config","show ip interface brief","show vlan","show version"],1,"show ip interface brief lists each interface with its IP address and up/down status."]]},
 {s:"pl-300",v:"Microsoft",c:"PL-300",n:"Microsoft Power BI Data Analyst",q:[
  ["Which language do you use to create calculated measures in Power BI?",["M","DAX","Python","SQL"],1,"Measures are written in DAX. M is the Power Query language used for data transformation."],
  ["Which schema design does Power BI recommend for performance and simpler DAX?",["Snowflake schema","Star schema","Flat single table","Graph model"],1,"A star schema with fact tables surrounded by dimension tables gives the best filtering and modeling experience."],
  ["You want report viewers to see only rows for their own region. What should you set up?",["Bookmarks","Row-level security","Drillthrough","Perspectives"],1,"Row-level security filters data per user based on roles and DAX filter rules."],
  ["Which storage mode queries the source system every time a visual refreshes?",["Import","DirectQuery","Dual","Cached"],1,"DirectQuery sends queries to the source at view time instead of storing a copy in the model."],
  ["Which feature keeps imported data current in the Power BI service on a schedule?",["Scheduled refresh","Quick insights","Q&A","Paginated reports"],0,"Scheduled refresh reloads imported data at set times, using a gateway for on-premises sources."],
  ["What does the CALCULATE function do in DAX?",["Creates a new table","Evaluates an expression in a modified filter context","Sorts a column","Converts text to numbers"],1,"CALCULATE changes the filter context and then evaluates the expression, which makes it the core of most measures."]]},
 {s:"az-104",v:"Microsoft",c:"AZ-104",n:"Microsoft Azure Administrator",q:[]},
 {s:"dp-700",v:"Microsoft",c:"DP-700",n:"Implementing Data Engineering Solutions Using Microsoft Fabric",q:[["Your team stores historical Parquet files in an Amazon S3 bucket. You want lakehouse users to query them in Fabric without copying the data. What should you create?", ["A Dataflow Gen2", "A OneLake shortcut", "A Copy activity", "A mirrored database"], 1, "A OneLake shortcut points to data in another location, such as S3 or ADLS Gen2, so it appears in the lakehouse without being copied."], ["Which file format do Fabric lakehouse tables use by default?", ["CSV", "Avro", "Delta (Parquet with a transaction log)", "ORC"], 2, "Lakehouse tables are Delta tables: Parquet data files plus a transaction log that adds ACID transactions and time travel."], ["You need an Azure SQL Database replicated into OneLake in near real time, with no pipelines to build or maintain. What should you use?", ["Database mirroring", "A scheduled Copy activity", "A Spark notebook", "An eventstream"], 0, "Mirroring continuously replicates supported operational databases into OneLake as Delta tables without ETL code."], ["A Data Factory pipeline must copy data from a SQL Server instance in your company's own data center. What must be in place?", ["A OneLake shortcut", "An on-premises data gateway", "A Spark environment", "A KQL database"], 1, "Fabric reaches data sources inside private on-premises networks through an on-premises data gateway installed in that network."], ["Which item should you use to ingest a continuous stream of IoT events into Fabric without writing code?", ["Dataflow Gen2", "Eventstream", "Deployment pipeline", "Semantic model"], 1, "Eventstream captures, transforms and routes real-time event data to destinations such as an eventhouse or lakehouse."], ["Analysts want to query streaming telemetry with Kusto Query Language. Where should the data land?", ["A warehouse", "An eventhouse (KQL database)", "A lakehouse Files folder", "A Power BI dataflow"], 1, "An eventhouse hosts KQL databases, which are optimized for time-series and log data queried with KQL."], ["Which KQL operator groups rows and calculates aggregates such as count() or avg()?", ["project", "where", "summarize", "extend"], 2, "summarize aggregates rows by the grouping columns you list, for example summarize count() by DeviceId."], ["A Delta table has thousands of small files and queries are slow. Which command compacts them into fewer, larger files?", ["VACUUM", "OPTIMIZE", "DESCRIBE HISTORY", "REFRESH TABLE"], 1, "OPTIMIZE rewrites many small files into larger ones, which reduces file-open overhead during reads."], ["What does VACUUM do on a Delta table?", ["Compacts small files", "Deletes data files no longer referenced and older than the retention period", "Rebuilds statistics", "Converts the table to Parquet"], 1, "VACUUM removes files that the current table version no longer uses and that are older than the retention threshold, which is 7 days by default."], ["Which write-time optimization applies special sorting and compression to Parquet files so Fabric engines read them faster?", ["Z-Order", "V-Order", "Bucketing", "Liquid clustering"], 1, "V-Order is a Fabric write-time optimization for Parquet that speeds up reads by Power BI, SQL and Spark engines."], ["You need multi-table transactions and full T-SQL INSERT, UPDATE and DELETE support. Which item should you use?", ["Lakehouse SQL analytics endpoint", "Warehouse", "Eventhouse", "Dataflow Gen2"], 1, "A Fabric warehouse supports T-SQL DML and multi-table transactions. A lakehouse SQL analytics endpoint is read-only."], ["A user tries to run UPDATE through a lakehouse's SQL analytics endpoint. What happens?", ["The update succeeds", "The statement fails because the endpoint is read-only", "The update is queued for Spark", "The table is converted to a warehouse table"], 1, "The SQL analytics endpoint allows reads only. Lakehouse tables are changed with Spark or by loading data, not with T-SQL DML."], ["A developer must create and edit items in a workspace but must not manage workspace access. Which role follows least privilege?", ["Admin", "Member", "Contributor", "Viewer"], 2, "Contributors can create and edit items. Members can also share and add people, and Admins manage everything."], ["Which language does Dataflow Gen2 use for its transformations?", ["DAX", "Power Query M", "KQL", "Scala"], 1, "Dataflow Gen2 is built on Power Query, so its transformations are Power Query M steps, usually authored in a visual editor."], ["Which pipeline activity runs a Fabric notebook as one step of an orchestration?", ["Script activity", "Notebook activity", "Lookup activity", "Web activity"], 1, "The Notebook activity runs a notebook and can pass parameters to it from the pipeline."], ["A pipeline must run the same Copy activity once for each table name in a list. Which activity should wrap it?", ["If Condition", "Until", "ForEach", "Switch"], 2, "ForEach iterates over an array, such as table names returned by a Lookup, and runs its inner activities for each item."], ["You load only new or changed rows from a source table each night. What does this pattern usually rely on?", ["A watermark column such as LastModifiedDate", "Truncating the target each run", "Reading the entire source every time", "A deployment pipeline"], 0, "Incremental loads keep the last processed watermark value and query only rows changed after it."], ["Which Delta Lake operation inserts new rows and updates matching rows in a single statement?", ["APPEND", "MERGE", "OVERWRITE", "RESTORE"], 1, "MERGE INTO matches source rows to target rows on a key, updating matches and inserting the rest, which is an upsert."], ["A dimension must keep the full history of a customer's address changes. Which approach fits?", ["Slowly changing dimension Type 1", "Slowly changing dimension Type 2", "Overwrite the row", "Delete and reload"], 1, "Type 2 adds a new row for each change, with effective dates or a current flag, so earlier versions are kept."], ["In a medallion architecture, which layer holds cleaned and conformed data that is not yet aggregated for reporting?", ["Bronze", "Silver", "Gold", "Platinum"], 1, "Bronze holds raw data, Silver holds cleaned and validated data, and Gold holds business-level aggregates."], ["You need to promote Fabric items from development to test to production workspaces. What should you use?", ["Git integration only", "Deployment pipelines", "OneLake shortcuts", "Monitoring hub"], 1, "Deployment pipelines move content between stage workspaces and let you set rules, such as different data sources per stage."], ["Which feature connects a Fabric workspace to Azure DevOps or GitHub for version control?", ["Git integration", "Mirroring", "Domains", "Capacity settings"], 0, "Workspace Git integration syncs supported items to a branch so you can commit, branch and review changes."], ["Where can you see the status and history of pipeline, notebook and dataflow runs across workspaces?", ["Admin portal", "Monitoring hub", "OneLake catalog", "Lineage view"], 1, "The Monitoring hub lists recent activity runs with their status, duration and owner."], ["You need to find which workloads consume the most capacity units on an F64 capacity. What should you use?", ["Monitoring hub", "Microsoft Fabric Capacity Metrics app", "Deployment pipeline history", "Spark UI"], 1, "The Capacity Metrics app reports capacity unit consumption, throttling and the items driving usage."], ["In a Fabric warehouse, how do you limit each salesperson to rows for their own region?", ["Dynamic data masking", "Row-level security with a security policy and predicate function", "Workspace Viewer role", "Column-level security"], 1, "Row-level security uses an inline table-valued function as a filter predicate, applied by CREATE SECURITY POLICY."], ["Support staff may query a customer table but must see email addresses only partially, such as aXX@XXXX.com. What should you configure?", ["Row-level security", "Dynamic data masking", "Sensitivity labels", "Column-level security"], 1, "Dynamic data masking obscures column values in query results for users without the UNMASK permission."], ["Which statement prevents a user from reading the Salary column while still reading the other columns of a warehouse table?", ["GRANT SELECT on the permitted columns only", "ALTER TABLE ... DROP COLUMN", "CREATE SECURITY POLICY", "Assign the Viewer role"], 0, "Column-level security grants SELECT on specific columns, so queries touching Salary fail for that user."], ["Notebook sessions take too long to start for small, frequent jobs. Which Spark option gives the fastest start with default settings?", ["A custom pool with large nodes", "Starter pools", "Autoscale disabled", "A new environment per run"], 1, "Starter pools keep live clusters ready, so sessions with default settings usually start in seconds."], ["Several notebooks need the same Python libraries and Spark properties. Where should you define them once?", ["In each notebook's first cell", "In a Fabric environment item", "In the lakehouse Files folder", "In a deployment rule"], 1, "An environment item holds libraries, Spark compute and configuration, and you attach it to notebooks or to the workspace."], ["A Delta table is filtered by OrderDate in most queries. Which design helps queries skip irrelevant files?", ["Partition or cluster the table by date", "Store it as CSV", "Disable V-Order", "Add more columns"], 0, "Partitioning or clustering by a commonly filtered column lets the engine prune files outside the filter range."], ["A Spark Structured Streaming job writes to a Delta table. What must you provide so it restarts without reprocessing data?", ["A checkpoint location", "A watermark column in the source", "A deployment rule", "A shortcut"], 0, "The checkpoint location stores stream progress and state, so a restarted query resumes where it stopped."], ["You want an email when sensor temperature exceeds a threshold in streaming data, without writing code. What should you use?", ["Activator", "Dataflow Gen2", "Warehouse trigger", "Lookup activity"], 0, "Activator monitors data, such as an eventstream, and fires actions like emails or Teams messages when conditions are met."], ["A pipeline must send a Teams message only when a Copy activity fails. How do you set this up?", ["Connect the message activity to the Copy activity's On fail path", "Add it at the start of the pipeline", "Use a ForEach activity", "Set a retry count"], 0, "Activity dependencies have Success, Fail, Completion and Skip paths. The On fail path runs only after a failure."], ["Which notebook magic command lets you run Spark SQL in a cell of a PySpark notebook?", ["%%sql", "%run", "%pip", "%%html"], 0, "%%sql switches that cell to Spark SQL, so you can query lakehouse tables with SQL."], ["Which command shows the versions, operations and timestamps recorded for a Delta table?", ["DESCRIBE HISTORY", "SHOW TABLES", "VACUUM", "OPTIMIZE"], 0, "DESCRIBE HISTORY reads the transaction log and lists each table version with its operation and time, which supports time travel."], ["Where should you land raw source files, such as JSON exports, in a lakehouse before converting them to tables?", ["The Tables section", "The Files section", "The SQL analytics endpoint", "A semantic model"], 1, "The Files section stores unmanaged files in any format. You then load or transform them into Delta tables in Tables."]]},

const L = "ABCD";

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const examCard = e => `<a class="exam" href="#exam-${e.s}"><span class="code">${e.c}</span><b>${esc(e.n)}</b><small>${e.v} · ${e.q.length ? e.q.length + " sample questions · " + FREE + " free" : "Question bank in progress"}</small></a>`;

function searchBox(id){
  return `<div class="search"><input id="${id}" type="search" placeholder="Search by code or name, e.g. AZ-900" aria-label="Search exams" autocomplete="off"><a class="btn btn-primary" href="#exams">Browse</a><div class="sugg" hidden></div></div>`;
}
function wireSearch(id){
  const i = document.getElementById(id); if(!i) return; const box = i.parentElement.querySelector(".sugg");
  i.addEventListener("input", () => {
    const t = i.value.trim().toLowerCase();
    const r = t ? EXAMS.filter(e => (e.c + " " + e.n + " " + e.v).toLowerCase().includes(t)).slice(0,6) : [];
    box.innerHTML = r.map(e => `<a href="#exam-${e.s}"><span class="mono" style="color:var(--accent)">${e.c}</span><span>${esc(e.n)}</span></a>`).join("") || (t ? `<a href="#exams">No match. See all exams</a>` : "");
    box.hidden = !t;
  });
}

function exams(){

function exam(slug){
  const e = EXAMS.find(x=>x.s===slug); if(!e) return exams();
  const a = st[e.s] || (st[e.s] = {});
  if(!e.q.length) return `<div class="wrap" style="padding-block:56px;max-width:720px">
    <a href="#exams" style="color:var(--muted)">← All exams</a>
    <p class="mono" style="color:var(--accent);margin-top:24px">${e.c}</p><h1 style="font-size:clamp(2rem,5vw,3rem);margin-top:8px">${esc(e.n)}</h1>
    <p style="color:var(--muted);margin-top:16px">This question bank is being written. Add questions to the <span class="mono">EXAMS</span> data for <span class="mono">${e.s}</span> and they appear here automatically.</p>
    <a class="btn btn-primary" href="#exams" style="margin-top:24px">Practice another exam</a></div>`;
  const n = e.q.length, done = Object.keys(a).length, ok = Object.entries(a).filter(([k,v])=>e.q[k][2]===v).length;
  cur = Math.min(cur, n-1);
  return `<div class="wrap prac">
    <aside class="side">
      <a href="#exams" style="color:var(--muted)">← All exams</a>
      <div><p class="mono" style="color:var(--accent)">${e.c}</p><h2 style="font-size:1.4rem;margin-top:6px">${esc(e.n)}</h2></div>
      <div><div class="bar"><i style="width:${done/n*100}%"></i></div><p style="color:var(--muted);font-size:.9rem;margin-top:8px">${done} of ${n} answered · ${ok} correct</p></div>
      <div class="map">${e.q.map((q,k)=>{const c=k>=FREE?"lock":a[k]===undefined?"":a[k]===q[2]?"ok":"no";return `<button class="${c} ${k===cur?"cur":""}" data-j="${k}" aria-label="Question ${k+1}">${k+1}</button>`}).join("")}</div>
      <button class="btn btn-ghost" id="reset" style="justify-content:center">Reset progress</button>
      <div style="border:1.5px dashed var(--line);border-radius:12px;padding:16px;display:grid;gap:8px"><span class="tag" style="justify-self:start">PDF</span><b>${e.c} premium PDF</b><p style="color:var(--muted);font-size:.9rem">All questions, answer key and explanations. Print it or study offline.</p><button class="btn btn-primary buy" style="justify-content:center">Buy PDF · ₹1,500</button></div>
    </aside>
    <div class="qcard">${cur>=FREE ? `<div class="locked">
        <span class="tag">Full bank</span><h2>Question ${cur+1} is part of the full bank</h2>
        <p style="color:var(--muted);max-width:44ch">You've used the ${FREE} free questions for ${e.c}. Unlock every question, explanations and progress tracking.</p>
        <a class="btn btn-primary" href="#pricing">See plans</a></div>` : q(e,a)}</div>
  </div>`;
}
function q(e,a){
  const Q = e.q[cur], ans = a[cur], has = ans!==undefined;
  return `<div class="qmeta"><span class="mono">Question ${String(cur+1).padStart(2,"0")} of ${e.q.length}</span><span>${cur<FREE?"Free question":""}</span></div>
    <p class="qtext">${esc(Q[0])}</p>
    <div class="opts">${Q[1].map((o,k)=>{let c="";if(has){if(k===Q[2])c="right";else if(k===ans)c="wrong"}return `<button class="opt ${c}" data-a="${k}" ${has?"disabled":""}><span class="bub">${L[k]}</span>${esc(o)}</button>`}).join("")}</div>
    ${has?`<div class="explain ${ans===Q[2]?"":"miss"}"><strong>${ans===Q[2]?"Correct.":"Not quite. The answer is "+L[Q[2]]+"."}</strong> ${esc(Q[3])}</div>`:""}
    <div class="qnav"><button class="btn btn-ghost" id="prev" ${cur===0?"disabled":""}>← Previous</button><button class="btn btn-primary" id="next" ${cur>=e.q.length-1?"disabled":""}>Next →</button></div>`;
}

function faq(){

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

function render(keepScroll){
  const h = location.hash.slice(1) || "home";
  let html, r = h.startsWith("exam-") ? "exams" : h;
  if(h==="exams") html=exams(); else if(h.startsWith("exam-")) html=exam(h.slice(5));
  else if(h==="pricing") html=pricing(); else if(h==="faq") html=faq(); else html=home();
  $("#app").innerHTML = html;
  document.querySelectorAll(".nav nav a[data-r]").forEach(a=>a.classList.toggle("on",a.dataset.r===r));
  wireSearch("hs"); wireSearch("es");
  if(!keepScroll) window.scrollTo(0,0);
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("button,a"); if(!t) return;
  const h = location.hash.slice(1);
  if(t.dataset.v){ filter = t.dataset.v; }
  if(t.dataset.f){ filter = t.dataset.f; render(true); return; }
  if(t.closest("#demo")){
    const s = EXAMS[1].q[0], k=+t.dataset.k;
    document.querySelectorAll("#demo .opt").forEach((b,i)=>{b.disabled=true;if(i===s[2])b.classList.add("right");else if(i===k)b.classList.add("wrong")});
    $("#demoX").textContent = (k===s[2]?"Correct. ":"Answer: B. ") + "ElastiCache serves reads from memory."; return;
  }
  if(h.startsWith("exam-")){
    const e = EXAMS.find(x=>x.s===h.slice(5)); if(!e) return;
    if(t.dataset.a!==undefined){ st[e.s][cur]=+t.dataset.a; save(); render(true); return; }
    if(t.dataset.j!==undefined){ cur=+t.dataset.j; render(true); return; }
    if(t.id==="next"){ cur++; render(true); return; }
    if(t.id==="prev"){ cur--; render(true); return; }
    if(t.id==="reset"){ st[e.s]={}; cur=0; save(); render(true); toast("Progress reset"); return; }
  }
  if(t.classList.contains("buy")) toast("Checkout isn't connected yet");
});
window.addEventListener("hashchange", () => { if(location.hash.startsWith("#exam-")) cur=0; render(); });
render();
